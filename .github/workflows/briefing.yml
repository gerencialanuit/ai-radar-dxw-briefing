name: DXW Weekly Briefing

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecucion"
        type: choice
        required: false
        default: "prueba"
        options:
          - publicar
          - prueba

permissions:
  contents: read

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run briefing (publicar)
        if: ${{ github.event.inputs.modo == 'publicar' || github.event_name == 'schedule' }}
        env:
          WEBHOOK_DXW_BRIEFING: ${{ secrets.WEBHOOK_DXW_BRIEFING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python briefing.py

      - name: Run briefing (prueba, dry-run)
        if: ${{ github.event.inputs.modo == 'prueba' && github.event_name != 'schedule' }}
        env:
          WEBHOOK_DXW_BRIEFING: ${{ secrets.WEBHOOK_DXW_BRIEFING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python briefing.py --dry-run
