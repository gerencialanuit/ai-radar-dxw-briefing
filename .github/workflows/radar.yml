name: AI Radar -> Discord

on:
  schedule:
    - cron: "0 13 * * 1-5"
    - cron: "0 21 * * 1-5"
  workflow_dispatch:
    inputs:
      horas:
        description: "Antiguedad maxima en horas (usar 168 para sembrar el archivo)"
        required: false
        default: "48"

permissions:
  contents: write

concurrency:
  group: ai-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          WEBHOOK_AI_RELEASES: ${{ secrets.WEBHOOK_AI_RELEASES }}
          WEBHOOK_AI_NEWS: ${{ secrets.WEBHOOK_AI_NEWS }}
          WEBHOOK_AI_BUSINESS: ${{ secrets.WEBHOOK_AI_BUSINESS }}
          WEBHOOK_DXW_BRIEFING: ${{ secrets.WEBHOOK_DXW_BRIEFING }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MAX_AGE_HOURS: ${{ github.event.inputs.horas || '48' }}
        run: python bot.py

      - name: Commit y push del estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main
            python merge_estado.py
            git add state.json
            if git diff --staged --quiet; then
              echo "Sin cambios en state.json"
              exit 0
            fi
            git commit -m "chore: update state [skip ci]"
            if git push; then
              exit 0
            fi
            echo "Push fallo (probablemente youtube.yml commiteo al mismo tiempo), re-fusionando ($i)..."
            git reset --soft HEAD~1
            sleep 5
          done
          echo "No se pudo commitear el estado tras varios intentos"
          exit 1
