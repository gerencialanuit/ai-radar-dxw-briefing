name: YouTube Viral -> Discord

on:
  schedule:
    - cron: "10 13 * * 1-5" # 10 min despues de radar.yml, para no chocar al commitear state.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-youtube
  cancel-in-progress: false

jobs:
  youtube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run YouTube viral
        env:
          WEBHOOK_YOUTUBE_AI: ${{ secrets.WEBHOOK_YOUTUBE_AI }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python bot.py --solo-youtube

      - name: Commit y push del estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch origin main
            python merge_estado.py
            cp state.json /tmp/state_merged.json
            git reset --hard origin/main
            cp /tmp/state_merged.json state.json
            git add state.json
            if git diff --staged --quiet; then
              echo "Sin cambios en state.json"
              exit 0
            fi
            git commit -m "chore: update state (youtube) [skip ci]"
            if git push; then
              exit 0
            fi
            echo "Push fallo (probablemente radar.yml commiteo al mismo tiempo), re-fusionando ($i)..."
            sleep 5
          done
          echo "No se pudo commitear el estado tras varios intentos"
          exit 1
