name: Herramientas

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "Accion a ejecutar"
        type: choice
        required: false
        default: "validar-feeds"
        options:
          - validar-feeds
          - prueba-sin-publicar
          - prueba-youtube

permissions:
  contents: read

jobs:
  herramientas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validar feeds
        if: ${{ github.event.inputs.accion == 'validar-feeds' }}
        run: python bot.py --check

      - name: Prueba sin publicar
        if: ${{ github.event.inputs.accion == 'prueba-sin-publicar' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py --dry-run

      - name: Prueba YouTube sin publicar
        if: ${{ github.event.inputs.accion == 'prueba-youtube' }}
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python bot.py --dry-run --solo-youtube
