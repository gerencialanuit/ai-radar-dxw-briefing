# ============================================================
#  AI RADAR -> DISCORD  |  feed sources and filters
# ============================================================

config:
  max_por_corrida: 12
  antiguedad_max_horas: 48
  resumir_con_ia: true
  briefing_idioma: en
  briefing_dias: 7
  briefing_max_items: 12
  briefing_score_minimo: 6

categorias:
  releases:
    webhook_env: WEBHOOK_AI_RELEASES
    color: 0x5A67D8
    emoji: "🚀"
    publicar_diario: true

  news:
    webhook_env: WEBHOOK_AI_NEWS
    color: 0x0EA5A4
    emoji: "📰"
    publicar_diario: true
    incluir: ["ai", "artificial intelligence", "llm", "model", "agent", "gpt",
              "claude", "gemini", "openai", "anthropic", "inteligencia artificial"]

  business:
    webhook_env: WEBHOOK_AI_BUSINESS
    color: 0xD97706
    emoji: "📈"
    publicar_diario: true
    incluir: ["ai", "artificial intelligence", "inteligencia artificial",
              "automation", "automatización", "growth", "marketing", "saas",
              "roi", "productivity", "enterprise", "agent"]
    excluir: ["crypto", "nft", "web3"]

  dxw:
    webhook_env: WEBHOOK_DXW_BRIEFING
    color: 0x111827
    emoji: "🎯"
    publicar_diario: false

feeds:
  # ---------- OFFICIAL LAB RELEASES -> #ai-releases ----------
  - nombre: "OpenAI News"
    url: "https://openai.com/news/rss.xml"
    categoria: releases
  - nombre: "Anthropic News (mirror)"
    url: "https://rsshub.bestblogs.dev/anthropic/news"
    categoria: releases
  - nombre: "Claude Code — Releases"
    url: "https://github.com/anthropics/claude-code/releases.atom"
    categoria: releases
  - nombre: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"
    categoria: releases
  - nombre: "Google DeepMind"
    url: "https://deepmind.google/blog/feed/basic/"
    categoria: releases
  - nombre: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    categoria: releases
  - nombre: "Meta AI Blog (mirror)"
    url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_meta_ai.xml"
    categoria: releases

  # ---------- NEWS & ANALYSIS -> #ai-news ----------
  # - nombre: "MarkTechPost"
  #   url: "https://www.marktechpost.com/feed/"
  #   categoria: news
  # Desactivado: Cloudflare bloquea el trafico automatizado con 403 en
  # cualquier ruta del feed, no depende de la URL. Sin mirror disponible.
  - nombre: "MIT Technology Review — AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
    categoria: news
  - nombre: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    categoria: news
  - nombre: "The Verge — AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    categoria: news
  - nombre: "VentureBeat AI"
    url: "https://venturebeat.com/category/ai/feed/"
    categoria: news
  - nombre: "Ars Technica AI"
    url: "https://arstechnica.com/ai/feed/"
    categoria: news

  # ---------- BUSINESS & GROWTH -> #ai-business-growth ----------
  # - nombre: "a16z"
  #   url: "https://a16z.com/feed/"
  #   categoria: business
  # Desactivado: a16z.com ya no expone RSS en ningun path conocido (404 en
  # /feed/, /rss/, /news-content/feed/, sin <link rel="alternate"> en el
  # home). Sin mirror comunitario disponible.
  - nombre: "Marketing AI Institute"
    url: "https://www.marketingaiinstitute.com/blog/rss.xml"
    categoria: business
  - nombre: "Last Week in AI"
    url: "https://lastweekin.ai/feed"
    categoria: business
  - nombre: "Ahead of AI (Raschka)"
    url: "https://magazine.sebastianraschka.com/feed"
    categoria: business
  - nombre: "GN — IA y negocios (ES)"
    url: "https://news.google.com/rss/search?q=%22inteligencia+artificial%22+(empresas+OR+negocios+OR+marketing)&hl=es-419&gl=CO&ceid=CO:es-419"
    categoria: business
  - nombre: "GN — AI growth marketing (EN)"
    url: "https://news.google.com/rss/search?q=%22AI%22+%22growth+marketing%22&hl=en-US&gl=US&ceid=US:en"
    categoria: business

